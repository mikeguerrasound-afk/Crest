name: Build installers

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x64, os: windows-latest, arch: x64, args: --win --x64 }
          - { name: mac-arm64, os: macos-latest, arch: arm64, args: --mac --arm64 }
          - { name: mac-x64, os: macos-latest, arch: x64, args: --mac --x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # ffmpeg-static downloads a binary for the arch given here
      - run: npm ci
        env:
          npm_config_arch: ${{ matrix.arch }}
      - run: npm test
        if: matrix.name != 'mac-x64'
      - run: npx electron-builder ${{ matrix.args }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: crest-${{ matrix.name }}
          path: |
            dist/*.dmg
            dist/*.exe
          if-no-files-found: error
